name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: life_organizer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/life_organizer_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/life_organizer_test
      # DB-backed tests must run in CI, not skip.
      REQUIRE_DB: "true"
      AI_ENABLED: "false"
      DISABLE_JOBS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      # Search eval on a seeded test user: fails if a negative returns anything or precision/recall < 90 %.
      - run: npm run eval:queries

  # Document reading on Windows: sharp, @napi-rs/canvas (scanned-PDF rendering) and Tesseract are native or
  # WASM packages with per-platform binaries, so their tests also run here. No database: DB tests skip.
  documents-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/life_organizer_test
      AI_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsx --import ./tests/setup.ts --test tests/documentOcr.test.ts tests/dateRules.test.ts tests/gridImage.test.ts

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
